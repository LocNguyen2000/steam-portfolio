<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Map Explorer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #101722;
        color: #f2f6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      #game {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: grid;
        place-items: center;
      }

      #game canvas {
        display: block;
        width: min(calc(100vw - 32px), 800px, 140vh) !important;
        height: auto !important;
      }

      .hud {
        position: fixed;
        z-index: 1;
        top: 20px;
        left: 20px;
        max-width: min(360px, calc(100vw - 40px));
        padding: 16px 18px;
        border: 1px solid rgb(207 222 255 / 15%);
        border-radius: 14px;
        background: rgb(13 21 33 / 82%);
        box-shadow: 0 12px 40px rgb(0 0 0 / 25%);
        backdrop-filter: blur(12px);
        pointer-events: none;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 17px;
        letter-spacing: 0.02em;
      }

      .hint {
        margin: 0;
        color: #b9c6dc;
        font-size: 13px;
        line-height: 1.5;
      }

      kbd {
        display: inline-block;
        min-width: 23px;
        margin: 0 1px;
        padding: 1px 5px;
        border: 1px solid #56657c;
        border-radius: 5px;
        background: #202d40;
        color: #fff;
        font: inherit;
        text-align: center;
      }

      #status {
        margin-top: 10px;
        color: #8ee3c0;
        font-size: 12px;
      }

      #time-toggle {
        margin-top: 12px;
        padding: 8px 12px;
        border: 1px solid rgb(207 222 255 / 24%);
        border-radius: 8px;
        background: #202d40;
        color: #f2f6ff;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        pointer-events: auto;
      }

      #time-toggle:hover {
        background: #2b3b53;
      }

      #time-toggle:focus-visible {
        outline: 2px solid #8ee3c0;
        outline-offset: 2px;
      }

      #inspection {
        position: fixed;
        z-index: 2;
        bottom: 20px;
        left: 50%;
        width: min(360px, calc(100vw - 32px));
        padding: 14px 18px;
        border: 1px solid rgb(207 222 255 / 20%);
        border-radius: 12px;
        background: rgb(13 21 33 / 92%);
        box-shadow: 0 12px 40px rgb(0 0 0 / 30%);
        color: #f2f6ff;
        transform: translateX(-50%);
        pointer-events: none;
      }

      #inspection[hidden] {
        display: none;
      }

      #inspection-title {
        margin: 0 0 4px;
        font-size: 15px;
      }

      #inspection-detail {
        margin: 0;
        color: #b9c6dc;
        font-size: 13px;
        line-height: 1.45;
      }

      @media (max-width: 520px) {
        .hud {
          top: 12px;
          left: 12px;
          padding: 12px 14px;
        }

        #inspection {
          bottom: 12px;
          padding: 11px 14px;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script defer src="./game.js"></script>
  </head>
  <body>
    <div id="game" aria-label="Room map game"></div>
    <section class="hud" aria-label="Game controls">
      <h1>Room Map Explorer</h1>
      <p class="hint">
        Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>, arrow keys,
        or tap to move on mobile. Approach room items and press <kbd>E</kbd> to
        inspect.
      </p>
      <button id="time-toggle" type="button" aria-pressed="false">
        Switch to night
      </button>
      <div id="status" role="status">Loading room assets…</div>
    </section>
    <aside id="inspection" aria-live="polite" hidden>
      <h2 id="inspection-title" data-inspection-title></h2>
      <p id="inspection-detail" data-inspection-detail></p>
    </aside>
  </body>
</html>
